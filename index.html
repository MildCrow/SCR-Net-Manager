<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SCR Netz-Manager</title>
<style>
  :root{
    --bg:#0b1420;
    --panel:#101d2c;
    --panel2:#152438;
    --line:#233247;
    --text:#eaf1f8;
    --dim:#7d93a8;
    --gold:#f2b632;
    --red:#e2273f;
    --blue:#1a9fe0;
    --orange:#e07b1a;
    --pink:#e6197e;
    --grey:#8fa3b3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;background:linear-gradient(180deg,var(--panel),var(--bg));
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:30px;height:30px;border-radius:8px;
    background:conic-gradient(from 180deg,var(--red),var(--orange),var(--gold),var(--pink),var(--blue),var(--grey),var(--red));}
  .brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand span{display:block;font-size:11px;color:var(--dim);margin-top:1px;}

  .right-cluster{display:flex;align-items:center;gap:18px;}
  .stats{display:flex;gap:20px;align-items:center;}
  .stat{text-align:right;}
  .stat .n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:10.5px;color:var(--dim);}
  .coin{color:var(--gold);}

  .langsw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .langsw button{border:none;background:var(--panel2);color:var(--dim);font-size:12px;
    font-weight:700;padding:7px 12px;cursor:pointer;}
  .langsw button.active{background:var(--gold);color:#1a1400;}
  .langsw button:not(.active):hover{background:var(--line);color:var(--text);}

  main{flex:1;position:relative;overflow:hidden;}
  svg{width:100%;height:100%;display:block;cursor:grab;}
  svg:active{cursor:grabbing;}

  .edge{stroke-linecap:round;fill:none;}
  .edge-locked{stroke:#1b2735;stroke-width:5;}
  .edge-open{stroke-width:5;}
  .edge-noop{stroke:#3a4a5c;stroke-width:5;stroke-dasharray:2 7;opacity:.75;}

  .stationdot{cursor:pointer;}
  .stationdot .ring{fill:var(--bg);stroke-width:3.5;}
  .stationdot .core{fill:var(--bg);}
  .stationdot text{fill:var(--text);font-size:12.5px;font-weight:600;pointer-events:none;}
  .stationdot.locked .ring{stroke:#2a3a4d;}
  .stationdot.locked text{fill:#4b5f74;}
  .stationdot.frontier .ring{stroke:var(--gold);animation:pulse 1.4s ease-in-out infinite;}
  .stationdot.frontier text{fill:var(--gold);}
  .badge{fill:var(--gold);}
  .badge text{fill:#1a1400;font-size:10px;font-weight:800;pointer-events:none;}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

  .train{filter:drop-shadow(0 0 3px rgba(0,0,0,.6));}

  #tooltip{
    position:absolute;pointer-events:none;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;
    display:none;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:230px;
  }
  #tooltip b{display:block;margin-bottom:2px;font-size:13.5px;}
  #tooltip .cost{color:var(--gold);font-weight:700;}
  #tooltip .free{color:#5fd685;font-weight:700;}

  #toast{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:10px 18px;font-size:13px;opacity:0;transition:opacity .25s,transform .25s;
    pointer-events:none;z-index:30;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .hint{position:absolute;top:14px;right:14px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:12px;
    color:var(--dim);max-width:240px;z-index:15;}

  .zoomctl{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;
    gap:6px;z-index:15;}
  .zoomctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:17px;cursor:pointer;}
  .zoomctl button:hover{background:var(--line);}

  /* Depot / Betreiber panel */
  #depot{position:absolute;top:14px;left:14px;width:238px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:12px;z-index:15;
    box-shadow:0 10px 24px rgba(0,0,0,.35);}
  #depot h2{margin:0 0 8px;font-size:12.5px;letter-spacing:.3px;color:var(--dim);font-weight:700;}
  .op-row{display:flex;align-items:center;gap:9px;padding:7px 4px;border-radius:8px;}
  .op-row+.op-row{border-top:1px solid #1c2c3f;}
  .op-sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;}
  .op-info{flex:1;min-width:0;}
  .op-name{font-size:12.5px;font-weight:700;}
  .op-sub{font-size:10.5px;color:var(--dim);}
  .op-btn{flex:0 0 auto;border:none;border-radius:7px;padding:6px 9px;font-size:11px;
    font-weight:700;cursor:pointer;color:#1a1400;background:var(--gold);white-space:nowrap;}
  .op-btn.locked{background:#233247;color:var(--dim);}
  .op-btn.free{background:#5fd685;}
  .op-btn:disabled{opacity:.45;cursor:default;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="mark"></div>
      <div>
        <h1 id="hTitle">SCR Netz-Manager</h1>
        <span id="hSub">Stepford County Railway &mdash; Streckenausbau-Simulation</span>
      </div>
    </div>
    <div class="right-cluster">
      <div class="stats">
        <div class="stat"><div class="n coin" id="coinN">0</div><div class="l" id="lCoin">M&uuml;nzen</div></div>
        <div class="stat"><div class="n" id="stationN">1</div><div class="l" id="lStations">Stationen frei</div></div>
        <div class="stat"><div class="n" id="trainN">0</div><div class="l" id="lTrainsActive">Z&uuml;ge im Einsatz</div></div>
        <div class="stat"><div class="n" id="depotN">0</div><div class="l" id="lTrainsDepot">Z&uuml;ge im Depot</div></div>
      </div>
      <div class="langsw" id="langsw">
        <button data-lang="de">DE</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>
  <main>
    <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tooltip"></div>
    <div id="toast"></div>
    <div id="depot"><h2 id="depotHeading">Betreiber &amp; Fuhrpark</h2><div id="opList"></div></div>
    <div class="hint" id="hintBox"></div>
    <div class="zoomctl">
      <button id="zin">+</button>
      <button id="zout">&minus;</button>
      <button id="zreset">&#8634;</button>
    </div>
  </main>
</div>

    notEnoughStation:(cost,coins)=>`Not enough coins \u2014 needs \u00a2${cost}, you have \u00a2${coins}.`,
    notEnoughOperator:(name,cost)=>`Not enough coins for ${name} \u2014 needs \u00a2${cost}.`,
    operatorUnlockedToast:(name)=>`${name} unlocked as an operator! You can now buy trains for them.`,
    notEnoughTrain:(cost,coins)=>`Not enough coins \u2014 needs \u00a2${cost}, you have \u00a2${coins}.`,
    firstTrainToast:(name)=>`First ${name} train picked up for free! It'll depart once track is open.`,
    trainBoughtToast:(name,cost)=>`New ${name} train bought for \u00a2${cost}.`,
    fleetCount:(n)=> n===1 ? `1 train in fleet` : `${n} trains in fleet`,
    operatorLocked:'Operator locked',
    buyOperator:(cost)=>`Unlock \u00a2${cost}`,
    trainFreeBtn:'Train: FREE',
    trainBuyBtn:(cost)=>`+ Train \u00a2${cost}`
  }
};
let lang = 'de';
function t(){ return I18N[lang]; }
function applyStaticText(){
  document.getElementById('hTitle').textContent = t().title;
  document.getElementById('hSub').textContent = t().sub;
  document.getElementById('lCoin').textContent = t().coins;
  document.getElementById('lStations').textContent = t().stations;
  document.getElementById('lTrainsActive').textContent = t().trainsActive;
  document.getElementById('lTrainsDepot').textContent = t().trainsDepot;
  document.getElementById('depotHeading').innerHTML = t().depotHeading;
  document.getElementById('hintBox').textContent = t().hint;
  document.title = t().title;
  document.querySelectorAll('#langsw button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
}
document.getElementById('langsw').addEventListener('click',(e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  lang = btn.dataset.lang;
  applyStaticText();
  drawStations();
  renderDepot();
  hideTip();
});

/* ---------- Streckennetz (angelehnt an die SCR-Karte) ---------- */

st('edgemead','Edgemead',1031,845);

const LINES = [
  { color:'red', path:['stepford_bay','cadoxton','financial_quarter','stepford_victoria'] },
  { color:'red', path:['cadoxton','beechley'] },
  { color:'red', path:['willowfield','hemdon_park','beechley','stepford_central','four_ways','stepford_east','high_street','st_helens_bridge','new_harrow','elsemere_junction','coxly_newtown','barton','denton_road','greenslade','whitney_green','east_berrily','beaulieu_park','morganstown','benton_bridge'] },
  { color:'blue', path:['whitefield','houghton_rake','woodhead_lane','stepford_ufc','whitefield_lido','high_street'] },
  { color:'blue', path:['stepford_victoria','financial_quarter','cadoxton','beechley','stepford_central','four_ways','stepford_east','high_street','st_helens_bridge','new_harrow','elsemere_junction','berrily','east_berrily','beaulieu_park','morganstown','airport_parkway','james_street','farleigh','rosedale_village'] },
  { color:'blue', path:['leighton_west','carnalea_bridge','rayleigh_bay'] },
  { color:'blue', path:['carnalea_bridge','aslockby','leighton_city','westercoast','faymere','edgemead','millcastle','starryloch','llyn'] },
  { color:'orange', path:['stepford_central','four_ways','stepford_east','high_street','st_helens_bridge','new_harrow','elsemere_junction','berrily','east_berrily','beaulieu_park','morganstown','esterfield','water_newton','rocket_parade'] },
  { color:'orange', path:['morganstown','benton_bridge','airport_west','airport_central','terminal_3'] },
  { color:'orange', path:['airport_central','terminal_1'] },
  { color:'pink', path:['newry_harbour','newry','eden_quay','faraday_road','west_benton','coxly','elsemere_pond','angel_pass','bodin','coxly_newtown','port_benton','morganstown_docks','robinson_way','benton_bridge'] },
  { color:'pink', path:['benton_bridge','morganstown','hampton_hargate','upper_staploe','leighton_stepford_road','leighton_city'] },
  { color:'pink', path:['llyn','starryloch','westwyvern','millcastle_racecourse','faymere','edgemead','aslockby'] },
  { color:'grey', path:['newry_harbour','benton','west_benton'] },
  
  { color:'grey', path:['benton','coxly','elsemere_pond','elsemere_junction'] },
  { color:'grey', path:['benton','cambridge_st_parkway','ashlan_park','connolly'] },
  { color:'grey', path:['benton','benton_bridge','airport_west','airport_central','terminal_2'] },
  { color:'grey', path:['airport_parkway','james_street','farleigh','rosedale_village','esterfield'] }
];

/* Kanten aus den Linien ableiten (mit Farbe) */
const edgeMap = new Map();
function edgeKey(a,b){ return a<b ? a+'|'+b : b+'|'+a; }
LINES.forEach(line=>{
  for(let i=0;i<line.path.length-1;i++){
    const a=line.path[i], b=line.path[i+1];
    const k = edgeKey(a,b);
    if(!edgeMap.has(k)) edgeMap.set(k,{a,b,colors:new Set()});
    edgeMap.get(k).colors.add(line.color);
  }
});
const EDGES = [...edgeMap.values()];

const ADJ = {};
Object.keys(S).forEach(id=>ADJ[id]=[]);
EDGES.forEach(e=>{ ADJ[e.a].push(e.b); ADJ[e.b].push(e.a); });

/* ---------- Betreiber ---------- */
const OPERATORS = [
  { id:'connect',  color:'blue',   name:'Connect',    unlockCost:0,   unlocked:true,  trainsOwned:0, trainBase:24, trainStep:14 },
  { id:'overground', color:'red', name:'Metro',  unlockCost:70,  unlocked:false, trainsOwned:0, trainBase:26, trainStep:15 },
  { id:'airlink',  color:'orange',name:'Airlink',      unlockCost:110, unlocked:false, trainsOwned:0, trainBase:30, trainStep:17 },
  { id:'metro',    color:'pink',  name:'Express',      unlockCost:90,  unlocked:false, trainsOwned:0, trainBase:28, trainStep:16 },
  { id:'underground', color:'grey', name:'Waterline',      unlockCost:130, unlocked:false, trainsOwned:0, trainBase:32, trainStep:18 }
];
function opById(id){ return OPERATORS.find(o=>o.id===id); }

function trainCost(op){
  if(op.id==='connect' && op.trainsOwned===0) return 0; // erster Connect-Zug gratis
  return Math.round(op.trainBase + op.trainsOwned*op.trainStep);
}

/* ---------- Stations-Fortschritt ---------- */
const START = 'stepford_victoria';
let unlocked = new Set([START]);
let coins = 40;
let stationFreeUsed = false;

function frontierSet(){
  const f = new Set();
  unlocked.forEach(id=>{ ADJ[id].forEach(n=>{ if(!unlocked.has(n)) f.add(n); }); });
  return f;
}
function stationCost(id){
  const base = 24 + unlocked.size * 9;
  const branchBonus = (ADJ[id].length>=3) ? 14 : 0;
  return Math.round(base + branchBonus);
}

/* ---------- Rendering setup ---------- */
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
function el(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

const gEdgesLocked = el('g',{});
const gEdgesOpen = el('g',{});
const gTrains = el('g',{});
const gStations = el('g',{});
svg.appendChild(gEdgesLocked);
svg.appendChild(gEdgesOpen);
svg.appendChild(gTrains);
svg.appendChild(gStations);

let view = {x:0,y:0,scale:1};
function applyView(){
  [gEdgesLocked,gEdgesOpen,gTrains,gStations].forEach(g=>g.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.scale})`));
}
let dragging=false, dragStart=null;
svg.addEventListener('pointerdown',e=>{ dragging=true; dragStart={x:e.clientX-view.x,y:e.clientY-view.y}; });
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{ if(dragging){ view.x=e.clientX-dragStart.x; view.y=e.clientY-dragStart.y; applyView(); }});
svg.addEventListener('wheel',e=>{ e.preventDefault(); const d = e.deltaY>0?0.9:1.1; view.scale=Math.min(2.6,Math.max(0.5,view.scale*d)); applyView(); },{passive:false});
document.getElementById('zin').onclick=()=>{view.scale=Math.min(2.6,view.scale*1.15);applyView();};
document.getElementById('zout').onclick=()=>{view.scale=Math.max(0.5,view.scale*0.87);applyView();};
document.getElementById('zreset').onclick=()=>{view={x:0,y:0,scale:1};applyView();};

/* ---------- Gleise zeichnen ---------- */
function drawEdges(){
  gEdgesLocked.innerHTML=''; gEdgesOpen.innerHTML='';
  EDGES.forEach(e=>{
    const a=S[e.a], b=S[e.b];
    const open = unlocked.has(e.a)&&unlocked.has(e.b);
    if(!open){
      gEdgesLocked.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:'edge edge-locked'}));
      return;
    }
    const colors=[...e.colors];
    colors.forEach((c,ci)=>{
      const offset=(ci-(colors.length-1)/2)*6;
      const dx=b.x-a.x, dy=b.y-a.y; const len=Math.hypot(dx,dy)||1;
      const nx=-dy/len*offset, ny=dx/len*offset;
      const op = OPERATORS.find(o=>o.color===c);
      const line = el('line',{ x1:a.x+nx,y1:a.y+ny,x2:b.x+nx,y2:b.y+ny });
      if(op && op.unlocked){
        line.setAttribute('class','edge edge-open');
        line.setAttribute('stroke',COLORS[c]);
      } else {
        line.setAttribute('class','edge edge-noop');
      }
      gEdgesOpen.appendChild(line);
    });
  });
}

/* ---------- Stationen zeichnen ---------- */
function drawStations(){
  gStations.innerHTML='';
  const frontier = frontierSet();
  Object.values(S).forEach(s=>{
    const isUnlocked = unlocked.has(s.id);
    const isFrontier = frontier.has(s.id);
    const grp = el('g',{class:'stationdot '+(isUnlocked?'unlocked':(isFrontier?'frontier':'locked')),
      transform:`translate(${s.x},${s.y})`});
    const ring = el('circle',{class:'ring', r:8});
    if(isUnlocked) ring.setAttribute('stroke', pickLineColor(s.id));
    grp.appendChild(ring);
    grp.appendChild(el('circle',{class:'core', r:3.4}));
    const txt = el('text',{x:12,y:4}); txt.textContent = s.name; grp.appendChild(txt);
    if(isFrontier){
      const cost = stationCost(s.id);
      const free = !stationFreeUsed;
      const bx=-8, by=-22;
      const badge = el('g',{class:'badge'});
      const bw = free? 40: (String(cost).length*8+22);
      badge.appendChild(el('rect',{x:bx,y:by,width:bw,height:16,rx:8}));
      const bt = el('text',{x:bx+bw/2,y:by+11.5,'text-anchor':'middle'});
      bt.textContent = free? t().free : ('\u00a2'+cost);
      badge.appendChild(bt);
      grp.appendChild(badge);
    }
    grp.addEventListener('click',()=>onStationClick(s.id,isFrontier));
    grp.addEventListener('mouseenter',(ev)=>showTip(ev,s,isUnlocked,isFrontier));
    grp.addEventListener('mousemove',(ev)=>positionTip(ev));
    grp.addEventListener('mouseleave',hideTip);
    gStations.appendChild(grp);
  });
}
function pickLineColor(id){
  for(const line of LINES){ if(line.path.includes(id)) return COLORS[line.color]; }
  return COLORS.grey;
}

const tooltip=document.getElementById('tooltip');
function showTip(ev,s,isUnlocked,isFrontier){
  let html = `<b>${s.name}</b>`;
  if(isUnlocked) html+=`<span style="color:#5fd685">${t().trackUnlocked}</span>`;
  else if(isFrontier){
    const cost=stationCost(s.id);
    html += !stationFreeUsed ? `<span class="free">${t().firstStationFree}</span>` : t().unlockStation(cost);
  } else {
    html += `<span style="color:#7d93a8">${t().lockedStationInfo}</span>`;
  }
  tooltip.innerHTML = html; tooltip.style.display='block'; positionTip(ev);
}
function positionTip(ev){
  const rect = svg.getBoundingClientRect();
  tooltip.style.left = (ev.clientX-rect.left+14)+'px';
  tooltip.style.top = (ev.clientY-rect.top+10)+'px';
}
function hideTip(){ tooltip.style.display='none'; }

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),1900);
}

function onStationClick(id,isFrontier){
  if(unlocked.has(id) || !isFrontier) return;
  const cost = stationCost(id);
  if(!stationFreeUsed){
    stationFreeUsed = true;
    unlocked.add(id);
    toast(t().stationFreeToast(S[id].name));
  } else {
    if(coins < cost){ toast(t().notEnoughStation(cost,coins)); return; }
    coins -= cost; unlocked.add(id);
    toast(t().stationPaidToast(S[id].name,cost));
  }
  assignReserveTrains();
  drawEdges(); drawStations(); renderDepot(); updateHUD();
}

/* ---------- Betreiber & Z\u00fcge kaufen ---------- */
// Ein Zug f\u00e4hrt entlang des gesamten freigeschalteten, zusammenh\u00e4ngenden
// Abschnitts einer Linie (routeIndex = Index in LINES), nicht nur auf einer Kante.
// pos ist ein Flie\u00dfkommaindex innerhalb von LINES[routeIndex].path.
let trains = []; // {operatorId,color,routeIndex(null=Depot),pos,dir,speed}

function buyOperator(op){
  if(op.unlocked) return;
  if(coins < op.unlockCost){ toast(t().notEnoughOperator(op.name,op.unlockCost)); return; }
  coins -= op.unlockCost; op.unlocked = true;
  toast(t().operatorUnlockedToast(op.name));
  assignReserveTrains();
  drawEdges(); renderDepot(); updateHUD();
}

function buyTrain(op){
  if(!op.unlocked) return;
  const cost = trainCost(op);
  const free = (op.id==='connect' && op.trainsOwned===0);
  if(!free && coins<cost){ toast(t().notEnoughTrain(cost,coins)); return; }
  if(!free) coins -= cost;
  op.trainsOwned++;
  const tr = { operatorId:op.id, color:COLORS[op.color], routeIndex:null, pos:0, dir:1, speed:0.55+Math.random()*0.25 };
  trains.push(tr);
  tryAssignTrain(tr);
  toast(free ? t().firstTrainToast(op.name) : t().trainBoughtToast(op.name,cost));
  renderDepot(); updateHUD();
}

/* Findet auf einer Linie den l\u00e4ngsten zusammenh\u00e4ngenden freigeschalteten
   Abschnitt (Start-/End-Index im path-Array). null, falls < 2 Stationen offen. */
function longestOpenRun(route){
  let bestLen=0,bestLo=0,bestHi=-1,curLo=null;
  for(let i=0;i<route.path.length;i++){
    if(unlocked.has(route.path[i])){
      if(curLo===null) curLo=i;
    } else if(curLo!==null){
      const len=i-curLo; if(len>bestLen){bestLen=len;bestLo=curLo;bestHi=i-1;} curLo=null;
    }
  }
  if(curLo!==null){ const len=route.path.length-curLo; if(len>bestLen){bestLen=len;bestLo=curLo;bestHi=route.path.length-1;} }
  return bestHi>bestLo ? {lo:bestLo,hi:bestHi} : null;
}
/* Erweitert lo/hi um eine bestimmte Positon herum, solange die Nachbarstationen
   im path-Array freigeschaltet sind (f\u00fcr laufende Z\u00fcge, deren Strecke gewachsen ist). */
function runBoundsAround(route,idx){
  let lo=idx, hi=idx;
  while(lo-1>=0 && unlocked.has(route.path[lo-1])) lo--;
  while(hi+1<route.path.length && unlocked.has(route.path[hi+1])) hi++;
  return {lo,hi};
}
function tryAssignTrain(tr){
  const op = opById(tr.operatorId);
  let best=null;
  LINES.forEach((route,ri)=>{
    if(route.color!==op.color) return;
    const run = longestOpenRun(route);
    if(!run) return;
    const busy = trains.filter(t2=>t2.routeIndex===ri).length;
    const len = run.hi-run.lo;
    if(!best || busy<best.busy || (busy===best.busy && len>best.len)){
      best = {routeIndex:ri, lo:run.lo, hi:run.hi, busy, len};
    }
  });
  if(!best) return false;
  tr.routeIndex = best.routeIndex; tr.pos = best.lo; tr.dir = 1;
  return true;
}
function assignReserveTrains(){
  trains.filter(tt=>tt.routeIndex===null).forEach(tryAssignTrain);
}

/* ---------- Depot-Panel ---------- */
function renderDepot(){
  const list = document.getElementById('opList');
  list.innerHTML='';
  OPERATORS.forEach(op=>{
    const row = document.createElement('div'); row.className='op-row';
    const sw = document.createElement('div'); sw.className='op-sw'; sw.style.background=COLORS[op.color];
    const info = document.createElement('div'); info.className='op-info';
    const name = document.createElement('div'); name.className='op-name'; name.textContent=op.name;
    const sub = document.createElement('div'); sub.className='op-sub';
    sub.textContent = op.unlocked ? t().fleetCount(op.trainsOwned) : t().operatorLocked;
    info.appendChild(name); info.appendChild(sub);
    const btn = document.createElement('button'); btn.className='op-btn';
    if(!op.unlocked){
      btn.textContent = t().buyOperator(op.unlockCost);
      btn.className += ' locked';
      btn.disabled = coins < op.unlockCost;
      btn.onclick = ()=>buyOperator(op);
    } else {
      const cost = trainCost(op);
      const free = (op.id==='connect' && op.trainsOwned===0);
      btn.textContent = free ? t().trainFreeBtn : t().trainBuyBtn(cost);
      if(free) btn.className += ' free';
      btn.disabled = !free && coins<cost;
      btn.onclick = ()=>buyTrain(op);
    }
    row.appendChild(sw); row.appendChild(info); row.appendChild(btn);
    list.appendChild(row);
  });
}

/* ---------- Z\u00fcge animieren ---------- */
function drawTrains(dt){
  gTrains.innerHTML='';
  trains.forEach(tr=>{
    if(tr.routeIndex===null) return; // wartet im Depot
    const route = LINES[tr.routeIndex];
    const centerIdx = Math.min(route.path.length-1, Math.max(0, Math.round(tr.pos)));
    if(!unlocked.has(route.path[centerIdx])){ tryAssignTrain(tr); return; }
    const {lo,hi} = runBoundsAround(route, centerIdx);
    if(hi<=lo){
      tr.pos = lo; // Strecke ist (noch) nur eine Station lang
    } else {
      tr.pos += tr.dir*tr.speed*dt;
      if(tr.pos>=hi){ tr.pos=hi; tr.dir=-1; earn(); }
      if(tr.pos<=lo){ tr.pos=lo; tr.dir=1; earn(); }
    }
    const i0=Math.floor(tr.pos), i1=Math.min(route.path.length-1,i0+1);
    const frac=tr.pos-i0;
    const p0=S[route.path[i0]], p1=S[route.path[i1]];
    const x=p0.x+(p1.x-p0.x)*frac, y=p0.y+(p1.y-p0.y)*frac;
    gTrains.appendChild(el('circle',{class:'train', cx:x, cy:y, r:5.5, fill:tr.color, stroke:'#0b1420','stroke-width':1.6}));
  });
}
function earn(){ coins += 2; updateHUD(); renderDepot(); }

/* ---------- HUD ---------- */
function updateHUD(){
  document.getElementById('coinN').textContent = Math.floor(coins);
  document.getElementById('stationN').textContent = unlocked.size;
  document.getElementById('trainN').textContent = trains.filter(tt=>tt.routeIndex!==null).length;
  document.getElementById('depotN').textContent = trains.filter(tt=>tt.routeIndex===null).length;
}

/* ---------- Game loop ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now;
  drawTrains(dt);
  requestAnimationFrame(loop);
}

/* ---------- Init ---------- */
applyStaticText();
drawEdges();
drawStations();
renderDepot();
updateHUD();
applyView();
requestAnimationFrame(loop);
</script>
</body>
